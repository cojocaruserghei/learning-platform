[project]
name = "learning-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cojocaruserghei", email = "cojocaru.serghei.nicolae@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "faker>=40.54.0",
    "fastapi[standard]>=0.163.2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]



[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
